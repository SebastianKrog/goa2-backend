[package]
name = "goa2-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
foldhash = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
flate2 = "1"

[features]
# Enable exhaustive corpus-backed unit gates; quick tests retain named smoke cases.
full-parity = []

[[test]]
name = "actions"
required-features = ["full-parity"]

[[test]]
name = "effects"
required-features = ["full-parity"]

[[test]]
name = "equality"
required-features = ["full-parity"]

[[test]]
name = "mines"
required-features = ["full-parity"]

[[test]]
name = "models"
required-features = ["full-parity"]

[[test]]
name = "object_execution"
required-features = ["full-parity"]

[[test]]
name = "objects"
required-features = ["full-parity"]

[[test]]
name = "planning"
required-features = ["full-parity"]

[[test]]
name = "spatial"
required-features = ["full-parity"]

[[test]]
name = "targeting"
required-features = ["full-parity"]

[[test]]
name = "terrain"
required-features = ["full-parity"]

[[test]]
name = "validation"
required-features = ["full-parity"]
