[workspace]
members = ["crates/goa2-core", "crates/goa2-search-cli", "crates/goa2-game-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Only this compiler is supported until a lower MSRV is independently tested.
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Fast local rule/test iteration. Keep release for final throughput measurements.
[profile.iterate]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
